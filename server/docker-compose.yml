# Local development infrastructure for the FarmBridge API.
#
#   docker compose up -d
#
# Postgres holds business data; Redis backs rate limiting and refresh-token
# revocation. Neither port is published beyond localhost — bind explicitly so a
# laptop on a shared network does not expose an unauthenticated database.

services:
  postgres:
    image: postgres:17-alpine
    container_name: farmbridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-farmbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in server/.env}
      POSTGRES_DB: ${POSTGRES_DB:-farmbridge}
    ports:
      # Host port is configurable: a locally installed Postgres often already
      # holds 5432. The container port never changes.
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-farmbridge} -d ${POSTGRES_DB:-farmbridge}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: farmbridge-redis
    restart: unless-stopped
    # A password even locally: dev habits become production habits.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in server/.env}
      --appendonly yes
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--no-auth-warning', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
